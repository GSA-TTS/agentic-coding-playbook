# Pre-commit hooks — run: pre-commit install
# All hooks pinned to commit SHAs for supply chain security (NIST SA-12).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  # Keep this rev in lockstep with the `ruff==` pin in pyproject.toml. Unlike
  # markdownlint below, this one cannot collapse to a single pin yet: CI invokes
  # a bare `ruff` from `pip install -e ".[dev]"` (ci.yml), so a `repo: local`
  # hook would resolve to whatever ruff is on the developer's PATH -- trading a
  # detectable drift for an undetectable one. Tracked for a proper fix.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # v0.16.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Markdown linting. The version is pinned ONCE, in
  # .github/linters/package.json (+ package-lock.json, which also carries the
  # transitive overrides and is what `npm audit` gates in CI). This hook
  # delegates to that install instead of pinning a second time via a remote rev,
  # so the two can never drift. Glob/ignore selection lives once in
  # .github/linters/run-markdownlint.mjs, shared with CI, so file selection
  # cannot drift between local and CI either. Mirrors agentic-coding-patterns#471.
  - repo: local
    hooks:
      # Local commits: auto-fix what is fixable.
      - id: markdownlint
        name: markdownlint (npm-pinned, --fix)
        entry: node .github/linters/run-markdownlint.mjs --fix
        language: system
        types: [markdown]
        pass_filenames: false
      # CI: check only, never --fix. With --fix the hook rewrites the file and
      # exits 0, so a real violation would pass silently -- CI must use this id.
      # `stages: [manual]` keeps it out of the default commit-time run.
      - id: markdownlint-check
        name: markdownlint (npm-pinned, check only)
        entry: node .github/linters/run-markdownlint.mjs
        language: system
        types: [markdown]
        pass_filenames: false
        stages: [manual]

  # Universal behavioral contract prerequisite (ADR-0003) — fail-closed.
  # Blocks the commit if the universal contract is not available. In the
  # playbook repo the repo's own AGENTS.md satisfies it; downstream projects
  # get an equivalent hook wired to their self-contained ensure-contract script.
  - repo: local
    hooks:
      - id: ensure-contract
        name: Ensure universal behavioral contract is available
        entry: python3 -m playbook_validator ensure-contract --root .
        language: system
        pass_filenames: false
        always_run: true

  # NOTE: GitHub Actions security scanning (zizmor) runs in CI only —
  # see .github/workflows/zizmor.yml. It is intentionally NOT a local
  # pre-commit hook: the zizmor CLI hard-fails when GITHUB_TOKEN is set
  # but empty (common in sandboxed shells), which made the local hook
  # brittle. CI provides a valid token and scans on every workflow change.
