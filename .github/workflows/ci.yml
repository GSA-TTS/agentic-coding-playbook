name: CI — Documentation Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    continue-on-error: true  # External URLs can be flaky — don't block CI
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: tcort/github-action-markdown-link-check@e7c7a18363c842693fadde5d41a3bd3573a7a225 # v1.1.2
        with:
          config-file: ".markdown-link-check.json"
          use-quiet-mode: "yes"
          folder-path: "."

  python:
    name: Python Lint, Test & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Markdown lint
        run: npx markdownlint-cli2

      - name: Ruff lint
        run: ruff check scripts/

      - name: Ruff format check
        run: ruff format --check scripts/

      - name: Run tests
        run: PYTHONPATH=scripts python3 -m pytest scripts/tests/ -v

      - name: SCA vulnerability scan
        run: pip install pip-audit && pip-audit -r requirements.lock

      - name: Validate frontmatter
        run: PYTHONPATH=scripts python3 -m playbook_validator validate-docs --root .

      - name: Validate landscape registry
        run: PYTHONPATH=scripts python3 -m playbook_validator validate-landscape --path data/federal-ai-landscape.yaml

      - name: Validate skills
        run: PYTHONPATH=scripts python3 -m playbook_validator validate-skills --root .

      - name: Verify INDEX.yaml is up to date
        run: PYTHONPATH=scripts python3 -m playbook_validator generate-index --check --root .
