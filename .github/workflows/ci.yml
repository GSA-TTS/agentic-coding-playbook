name: CI — Documentation Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Official Semgrep container - Semgrep CE is LGPL-2.1 licensed (free)
      # Pinned by digest (zizmor unpinned-images); digest = semgrep/semgrep:latest
      image: semgrep/semgrep@sha256:f4791a54c891eabe1188248135574e6e03dfc31dfd3f3b747c7bec7079bfed1b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep CE scan
        # Using Semgrep Community Edition with public rulesets (no license required)
        # Rulesets: p/python (Python security), p/security-audit (general security)
        run: semgrep scan --config p/python --config p/security-audit scripts/

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # External URLs can be flaky — don't block CI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
        with:
          config-file: ".markdown-link-check.json"
          use-quiet-mode: "yes"
          folder-path: "."

  python:
    name: Python Lint, Test & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"  # Use bugfix-phase Python (3.12 is security-only)
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ".github/linters/package-lock.json"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Provision universal behavioral contract (ADR-0003)
        # Model the intended steady state: the contract is provided by the
        # environment at the conventional home path, then verified offline.
        # In this repo the contract IS our own AGENTS.md, so we install it to
        # the home path rather than fetching over the network.
        run: |
          mkdir -p "$HOME/.agentic-coding-playbook"
          cp AGENTS.md "$HOME/.agentic-coding-playbook/AGENTS.md"

      - name: Ensure universal contract is available (fail-closed)
        run: PYTHONPATH=scripts python3 -m playbook_validator ensure-contract --root . --no-fetch

      - name: Install linter dependencies
        working-directory: .github/linters
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Markdown lint
        run: npx --prefix .github/linters markdownlint-cli2 "**/*.md" "#node_modules" "#.github/linters/node_modules" "#CHANGELOG.md"

      - name: Ruff lint
        run: ruff check scripts/

      - name: Ruff format check
        run: ruff format --check scripts/

      - name: Run tests
        run: PYTHONPATH=scripts python3 -m pytest scripts/tests/ -v

      - name: SCA vulnerability scan
        run: |
          # Upgrade pip first to avoid self-referential vulnerability (PYSEC-2026-196)
          pip install --upgrade pip
          pip install pip-audit
          # Audit the installed environment but skip pip/setuptools (CI tooling).
          # The --skip-editable flag ignores the local playbook-validator package.
          pip-audit --skip-editable

      - name: Validate frontmatter
        run: PYTHONPATH=scripts python3 -m playbook_validator validate-docs --root .

      - name: Validate landscape registry
        run: PYTHONPATH=scripts python3 -m playbook_validator validate-landscape --path data/federal-ai-landscape.yaml

      - name: Validate skills
        run: PYTHONPATH=scripts python3 -m playbook_validator validate-skills --root .

      - name: Validate ADRs (decision records)
        run: PYTHONPATH=scripts python3 -m playbook_validator validate-adrs --dir docs/decisions

      - name: Audit repo compliance baseline
        run: PYTHONPATH=scripts python3 -m playbook_validator audit-repo --path .

      # Advisory (non-gating) until the self-scan false-positives + lock-file
      # item are resolved (tracked in GSA-TTS/agentic-coding-playbook#259 and a
      # pre-deploy self-scan-exclusion follow-up). Surfaces the checks without
      # knowingly redding main; promote to gating once green.
      - name: Pre-deployment security checks (advisory)
        continue-on-error: true
        run: PYTHONPATH=scripts python3 -m playbook_validator pre-deploy --path .

      - name: Verify INDEX.yaml is up to date
        run: PYTHONPATH=scripts python3 -m playbook_validator generate-index --check --root .
