# Reusable Markdown Quality Workflow
# Provides markdown linting and optional link checking
#
# Usage:
#   jobs:
#     markdown:
#       uses: GSA-TTS/agentic-coding-playbook/.github/workflows/reusable-markdown-quality.yml@main
#       with:
#         run-link-check: true

name: Reusable Markdown Quality

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '22'
      markdownlint-globs:
        description: 'Glob pattern(s) for markdownlint (uses .markdownlint-cli2.jsonc if exists)'
        required: false
        type: string
        default: ''
      run-link-check:
        description: 'Run markdown link checker'
        required: false
        type: boolean
        default: false
      link-check-config:
        description: 'Path to .markdown-link-check.json config'
        required: false
        type: string
        default: '.markdown-link-check.json'
      link-check-path:
        description: 'Directory to check for links'
        required: false
        type: string
        default: '.'
      continue-on-link-error:
        description: 'Continue if link check fails (for flaky external URLs)'
        required: false
        type: boolean
        default: true

concurrency:
  group: markdown-quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run markdownlint
        run: |
          if [ -n "${{ inputs.markdownlint-globs }}" ]; then
            npx markdownlint-cli2 "${{ inputs.markdownlint-globs }}"
          else
            npx markdownlint-cli2
          fi

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.run-link-check }}
    continue-on-error: ${{ inputs.continue-on-link-error }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check markdown links
        uses: tcort/github-action-markdown-link-check@e7c7a18363c842693fadde5d41a3bd3573a7a225 # v1.1.2
        with:
          config-file: ${{ inputs.link-check-config }}
          use-quiet-mode: 'yes'
          folder-path: ${{ inputs.link-check-path }}
