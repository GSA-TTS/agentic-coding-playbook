# Reusable PR Lint Workflow
# Validates PR titles and optionally all commits follow Conventional Commits
#
# Usage:
#   jobs:
#     lint:
#       uses: GSA-TTS/agentic-coding-playbook/.github/workflows/reusable-pr-lint.yml@main
#       with:
#         validate-commits: true
#
# Note: GITHUB_TOKEN is automatically inherited from the calling workflow.
# Do not pass it explicitly as a secret (reserved name collision).

name: Reusable PR Lint

on:
  workflow_call:
    inputs:
      validate-commits:
        description: 'Validate all commits in addition to PR title'
        required: false
        type: boolean
        default: false
      allowed-types:
        description: 'Comma-separated list of allowed commit types'
        required: false
        type: string
        default: 'feat,fix,docs,chore,refactor,test,perf,ci,style,build,revert,security'
      node-version:
        description: 'Node.js version to use for commitlint'
        required: false
        type: string
        default: '22'
    # Note: GITHUB_TOKEN is automatically available to reusable workflows
    # via the permissions block - no need to pass as secret

concurrency:
  group: pr-lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: Conventional Commit Title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            ci
            style
            build
            revert
            security
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: |
            PR title must follow conventional commits format:
            <type>: <description>
            Example: feat: add new feature

  commits:
    name: Validate Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ inputs.validate-commits }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install commitlint
        run: |
          npm install --save-dev \
            @commitlint/cli@19.3.0 \
            @commitlint/config-conventional@19.2.2

      - name: Validate PR title via commitlint
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint

      - name: Validate all commits in PR
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose
