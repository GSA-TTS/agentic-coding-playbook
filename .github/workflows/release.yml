name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TAG="${GITHUB_REF_NAME}"

          PREV_TAG="$(git tag --sort=-version:refname | grep -Fxv "${CURRENT_TAG}" | head -1 || true)"

          if [[ -z "${PREV_TAG}" ]]; then
            RANGE_START="$(git rev-list --max-parents=0 HEAD | tail -1)"
            COMPARE_LABEL=""
          else
            RANGE_START="${PREV_TAG}"
            COMPARE_LABEL="${PREV_TAG}...${CURRENT_TAG}"
          fi

          COMMITS="$(git log "${RANGE_START}..HEAD" --pretty=format:'- %s (%h)' --no-merges || true)"

          if [[ -z "${COMMITS}" ]]; then
            COMMITS="- No non-merge commits found in this release range."
          fi

          DOC_TABLE="$(
            python3 <<'PY'
            from pathlib import Path

            index_path = Path("INDEX.yaml")

            print("| Document | Description |")
            print("|----------|-------------|")

            if not index_path.exists():
                print("| INDEX.yaml | Not found at release time |")
                raise SystemExit(0)

            current_path = None
            current_description = None
            rows = []

            for raw_line in index_path.read_text(encoding="utf-8").splitlines():
                line = raw_line.strip()

                if line.startswith("path:"):
                    current_path = line.split(":", 1)[1].strip().strip('"')
                elif line.startswith("description:"):
                    current_description = line.split(":", 1)[1].strip().strip('"')

                    if current_path:
                        safe_path = current_path.replace("|", "\\|")
                        safe_description = (current_description or "").replace("|", "\\|")
                        rows.append((safe_path, safe_description))
                        current_path = None
                        current_description = None

            if not rows:
                print("| _None detected_ | _No document entries parsed from INDEX.yaml_ |")
            else:
                for path, description in rows:
                    print(f"| {path} | {description} |")
            PY
          )"

          {
            echo "notes<<RELEASE_EOF"
            echo "## What's Changed"
            echo
            echo "${COMMITS}"
            echo
            echo "## Documents"
            echo
            echo "${DOC_TABLE}"
            echo
            echo "---"
            echo
            if [[ -n "${PREV_TAG}" ]]; then
              echo "**Full Changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${COMPARE_LABEL}"
            else
              echo "**Full Changelog:** Initial tagged release from repository history through ${CURRENT_TAG}"
            fi
            echo "RELEASE_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: false
          make_latest: true
