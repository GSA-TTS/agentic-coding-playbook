name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          # Get the previous tag (or first commit if no previous tag)
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${{ github.ref_name }}" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          # Generate changelog from commits
          {
            echo "notes<<RELEASE_EOF"
            echo "## What's Changed"
            echo ""
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges
            echo ""
            echo ""
            echo "## Documents"
            echo ""
            echo "| Document | Description |"
            echo "|----------|-------------|"
            # Extract from INDEX.yaml
            grep -A2 'path:' INDEX.yaml | grep -E '(path|description)' | paste - - | sed 's/.*path: "\(.*\)".*description: "\(.*\)"/| \1 | \2 |/'
            echo ""
            echo "---"
            echo ""
            echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: false
          make_latest: "true"
