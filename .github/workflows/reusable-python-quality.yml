# Reusable Python Quality Workflow
# Provides linting, formatting, testing, and security scanning for Python projects
#
# Usage:
#   jobs:
#     python:
#       uses: GSA-TTS/agentic-coding-playbook/.github/workflows/reusable-python-quality.yml@main
#       with:
#         python-version: '3.13'
#         scripts-path: 'scripts/'
#         run-tests: true

name: Reusable Python Quality

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.13'
      scripts-path:
        description: 'Path to Python scripts directory for linting'
        required: false
        type: string
        default: 'scripts/'
      run-tests:
        description: 'Run pytest'
        required: false
        type: boolean
        default: true
      test-path:
        description: 'Path to test directory'
        required: false
        type: string
        default: 'scripts/tests/'
      run-pip-audit:
        description: 'Run pip-audit for vulnerability scanning'
        required: false
        type: boolean
        default: true
      pip-audit-flags:
        description: 'Additional flags for pip-audit'
        required: false
        type: string
        default: '--skip-editable'
      install-command:
        description: 'Command to install dependencies'
        required: false
        type: string
        default: 'pip install -e ".[dev]"'
      pythonpath:
        description: 'PYTHONPATH to set for commands'
        required: false
        type: string
        default: 'scripts'

concurrency:
  group: python-quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          ${{ inputs.install-command }}

      - name: Ruff lint
        run: ruff check ${{ inputs.scripts-path }}

      - name: Ruff format check
        run: ruff format --check ${{ inputs.scripts-path }}

  test:
    name: Test
    runs-on: ubuntu-latest
    if: ${{ inputs.run-tests }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          ${{ inputs.install-command }}

      - name: Run tests
        env:
          PYTHONPATH: ${{ inputs.pythonpath }}
        run: |
          if [ -d "${{ inputs.test-path }}" ]; then
            python -m pytest ${{ inputs.test-path }} -v
          else
            echo "::notice::No tests found in ${{ inputs.test-path }} - skipping"
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    if: ${{ inputs.run-pip-audit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          ${{ inputs.install-command }}
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit ${{ inputs.pip-audit-flags }}
