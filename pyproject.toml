[project]
name = "playbook-validator"
version = "0.6.3"
description = "Validation and generation tools for the agentic-coding-playbook"
license = "CC0-1.0"
requires-python = ">=3.12"
dependencies = [
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.11",
    "pre-commit==4.5.1",
]

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
]
ignore = [
    "S101",  # assert used in tests
]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/*" = ["S101", "S106", "S603", "S607"]
"scripts/playbook_validator/doctor.py" = ["S603", "S607"]
"scripts/playbook_validator/audit_repo.py" = ["S603", "S607"]
"scripts/playbook_validator/index_updaters.py" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
